<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Plan illustré du premier étage</title>
  <desc id="desc">Plan redessiné sans signalétique de sécurité : la zone centrale à gauche est une ouverture sur la Halle du rez-de-chaussée. Les petites pièces sans nom, la passerelle, les laboratoires, les bureaux dont le Bureau Kévin à droite de Visioconférence, le couloir de l'Aile Magnien et la Salle de réunion sont conservés.</desc>
  <defs>
    <pattern id="paper" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M0 25h26M25 0v26" stroke="#d4c39f" stroke-width=".7" opacity=".46"/></pattern>
    <pattern id="terrace" width="17" height="17" patternUnits="userSpaceOnUse"><path d="M0 17L17 0" stroke="#b7d1bf" stroke-width="1.4" opacity=".62"/></pattern>
    <pattern id="halleBelow" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 22h22M22 0v22" stroke="#dfb971" stroke-width="1" opacity=".5"/></pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#b7a584" flood-opacity=".6"/></filter>
    <style>
      .partition{stroke:#263943;stroke-width:3.5;fill:none}.door{stroke:#f8efd8;stroke-width:7}.room{stroke:#263943;stroke-width:4;fill:#e9dfc9}.unnamed{fill:#eae0cf}.lab{fill:#d5e3d7}.blue{fill:#d4e2e8}.warm{fill:#f5dfb0}.purple{fill:#dfd6e8}.note{fill:#665f55;font:800 11px Trebuchet MS,Arial,sans-serif;letter-spacing:1.5px}.floor{fill:#9f5b45;font:900 18px Trebuchet MS,Arial,sans-serif;letter-spacing:4px}
    </style>
  </defs>
  <rect x="7" y="7" width="986" height="686" rx="24" fill="#f8efd8" stroke="#263943" stroke-width="8"/>
  <rect x="18" y="18" width="964" height="664" rx="14" fill="url(#paper)"/>

  <!-- The northern technical rooms and the open void follow the source footprint. -->
  <path d="M108 49H477V170H108Z" class="room unnamed" filter="url(#shadow)"/>
  <path d="M437 170h24" class="door"/>
  <text x="292" y="113" class="note" text-anchor="middle">LOCAUX CTA</text>
  <path d="M164 172H477V520H164Z" fill="#f7dfaa" stroke="#263943" stroke-width="5"/>
  <path d="M171 179H470V513H171Z" fill="url(#halleBelow)"/>
  <text x="291" y="320" fill="#765947" font-family="Georgia,Cambria,serif" font-size="28" font-weight="900" text-anchor="middle">Halle</text>
  <text x="291" y="343" class="note" text-anchor="middle">AU REZ-DE-CHAUSSÉE</text>
  <text x="291" y="365" fill="#8b8170" font-family="Trebuchet MS,Arial,sans-serif" font-size="12" text-anchor="middle">Ouverture · aucun plancher ici</text>

  <!-- The passerelle runs inside the Halle opening and joins the CTA block. -->
  <path d="M438 172H477V432H438Z" class="room unnamed"/>
  <text x="458" y="270" class="note" text-anchor="middle" transform="rotate(-90 458 270)">PASSERELLE</text>
  <path d="M438 432H477V519H438Z" class="room unnamed"/>
  <path d="M439 449H476M439 465H476M439 481H476M439 497H476" class="partition"/>

  <!-- GP and Analytique retain their individual bays and small interior divisions. -->
  <path d="M490 188H589V332H490Z" class="room lab"/>
  <path d="M490 264H589M490 297H589" class="partition"/>
  <path d="M490 231v17M490 274v12M490 307v12" class="door"/>
  <path d="M490 334H589V428H490Z" class="room blue"/>
  <path d="M490 359v17M490 402v13" class="door"/>
  <path d="M490 430H589V518H490Z" class="room warm"/>
  <path d="M541 479V518M541 479H589" class="partition"/>
  <path d="M490 459v17" class="door"/>
  <text x="539" y="477" class="note" text-anchor="middle" style="font-size:9px;letter-spacing:0"><tspan x="539">SALLE DE</tspan><tspan x="539" dy="12">DÉTENTE</tspan></text>

  <!-- Patio and each office along its southern edge. -->
  <path d="M592 128H958V443H592Z" fill="#dce9d9" stroke="#263943" stroke-width="5" filter="url(#shadow)"/>
  <path d="M599 136H950V435H599Z" fill="url(#terrace)"/>
  <text x="775" y="286" fill="#66806f" font-family="Trebuchet MS,Arial,sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="4">PATIO</text>
  <path d="M591 445H958V518H591Z" class="room unnamed"/>
  <path d="M620 445V518M649 445V518M704 445V518M760 445V518M838 445V518M908 445V518" class="partition"/>
  <path d="M597 518h14M630 518h14M666 518h14M718 518h14M781 518h14M858 518h14M923 518h14" class="door"/>

  <!-- Aile Magnien is the toll point on the long east-west corridor. -->
  <path d="M29 520H958V557H29Z" fill="#f8efd8" stroke="#263943" stroke-width="5"/>
  <path d="M402 521V557" stroke="#dc955f" stroke-width="12" stroke-dasharray="10 7"/>
  <path d="M420 539H944" stroke="#e4b86e" stroke-width="3" stroke-dasharray="12 13"/>
  <path d="M61 539H388" stroke="#e4b86e" stroke-width="3" stroke-dasharray="12 13"/>

  <!-- Meeting room, video room, Thésards and every unlabelled room in the lower wing. -->
  <path d="M31 558H958V651H31Z" class="room unnamed"/>
  <path d="M113 558V651M284 558V651M349 558V651M407 558V651M438 558V651M469 558V651M590 558V651M649 558V651M706 558V651M758 558V651M818 558V651M877 558V651" class="partition"/>
  <path d="M34 590H113" class="partition"/>
  <path d="M130 558h18M305 558h17M368 558h16M416 558h14M445 558h14M495 558h18M611 558h16M669 558h16M721 558h16M777 558h16M833 558h16M896 558h16" class="door"/>
  <path d="M114 559H283V650H114Z" fill="#dfd6e8" stroke="#263943" stroke-width="4"/>
  <path d="M140 558h18" class="door"/>
  <path d="M350 559H406V650H350Z" class="room blue"/>
  <path d="M368 558h16" class="door"/>
  <path d="M470 559H589V650H470Z" fill="#e7d9c6" stroke="#263943" stroke-width="4"/>
  <path d="M497 558h17" class="door"/>
  <text x="316" y="605" class="note" text-anchor="middle" style="font-size:8px;letter-spacing:0" transform="rotate(-90 316 605)">VISIOCONFÉRENCE</text>
  <text x="42" y="674" class="floor">1ER ÉTAGE</text>
</svg>
